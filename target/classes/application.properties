# ===================================================
# TicketFlow - application.properties
# ===================================================

# --- Applicazione ---
spring.application.name=ticketflow
spring.config.import=optional:file:env.properties

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketflow
spring.datasource.username=${DB_USERNAME:ticketflow_user}
spring.datasource.password=${DB_PASSWORD:ticketflow_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Multipart (upload immagini) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Server ---
server.port=8080

# --- JWT ---
app.jwt.secret=${JWT_SECRET:myDevelopmentSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecurityPurposes}
app.jwt.expiration=86400000

# --- Cloudinary ---
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# --- Mailgun ---
app.mailgun.api-key=${MAILGUN_API_KEY:}
app.mailgun.domain=${MAILGUN_DOMAIN:}
app.mailgun.from=${MAILGUN_FROM:noreply@ticketflow.it}

# --- Logging ---
logging.level.it.ticketflow=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===== GRAPHQL =====
spring.graphql.graphiql.enabled=true
spring.graphql.schema.printer.enabled=true
spring.graphql.schema.introspection.enabled=true