version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: ticketflow-db
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow_user
      POSTGRES_PASSWORD: ticketflow_secret
    ports:
      - "5432:5432"
    volumes:
      - ticketflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow_user -d ticketflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ticketflow_data: